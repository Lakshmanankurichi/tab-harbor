<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tab Harbor</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">⚓</div>
      <div class="brand">
        <h1>Tab Harbor</h1>
        <p class="tagline">Your tabs, finally organized.</p>
      </div>
    </header>

    <main>
      <div class="tab-preview">
        <span id="tab-count" class="tab-count">Counting tabs...</span>
      </div>

      <button id="harbor-btn" class="harbor-btn" disabled>
        ⚓ Harbor All Tabs
      </button>

      <div id="status" class="status hidden"></div>
    </main>

    <footer>
      <a id="dashboard-link" href="#" target="_blank" class="dashboard-link">
        Open Dashboard →
      </a>
    </footer>
  </div>

  <script src="../utils/uuid.js"></script>
  <script src="popup.js"></script>
</body>
</html>
